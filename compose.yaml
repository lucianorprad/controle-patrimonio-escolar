services:
  frontend:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
    image: frontend:v2.0.0
    container_name: frontend
    restart: unless-stopped
    volumes:
      - ./frontend-angular:/app
      - /app/node_modules
    depends_on:
      - backend
    ports:
      - "80:4200"

  db:
    image: mysql:8.4
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT_HOST:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --host=127.0.0.1 --user=root --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: backend:v1.0.0
    container_name: backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DEBUG: ${DEBUG:-${DJANGO_DEBUG:-0}}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/app/scripts/commands.sh"]

volumes:
  mysql_data:
    driver: local
